[package]
name = "workenv-external-example"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace]

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
