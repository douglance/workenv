[package]
name = "workenv"
version = "0.1.0"
edition = "2021"
description = "Personal development workers through one CLI and MCP command graph"

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
fs2 = "0.4"
incurs = { version = "=0.5.3", features = ["mcp"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
