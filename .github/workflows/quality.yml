name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=
      - name: Workenv Check
        run: nix run github:cachix/devenv/e0781f7bee573eefcab4a7d2788fd9b455560ca2 -- shell -- workenv-check
      - name: Evaluate Devenv Modules
        run: |
          # The point of this step is the one thing workenv-check cannot do:
          # evaluate the modules from a directory that is not the repository, so
          # an import that only resolves relative to the source tree is caught.
          #
          # The enable list and the expected extension list are derived from
          # adapters/ rather than written out. Both were hand-kept and both were
          # stale: this step enabled eight adapters and named nine extensions,
          # never mentioning orchard or project, so a manifest missing both
          # entirely passed green -- verified by feeding this step's own jq a
          # manifest with neither in it.
          #
          # Versions are deliberately not asserted here. The list used to pin
          # "0.2.0", which turns CI red on a version bump with no defect behind
          # it, and re-reading Cargo.toml instead would only check that the
          # modules agree with the file they already read. That assertion lives
          # in modules/tests/adapter-coverage.nix, against Cargo.lock.
          adapters="$(cd "${GITHUB_WORKSPACE}/adapters" && ls -d */ | sed 's#/##' | sort)"
          # Measured, not declared. This asserted `-ge 10`, a count written when
          # there were ten adapters; deleting the Lima and herdr substrate left
          # eight and turned this red with no defect behind it -- the third
          # hand-kept number in this file to go stale the same way. What the step
          # actually needs is that the list is not empty and that every name in it
          # has a module to enable, and those two sides come from two directories.
          test -n "$adapters"
          for adapter in $adapters; do
            test -f "${GITHUB_WORKSPACE}/modules/${adapter}.nix" || {
              echo "adapter $adapter has no module to enable"
              exit 1
            }
          done

          check_dir="$(mktemp -d)"
          cp "${GITHUB_WORKSPACE}/devenv.yaml" "$check_dir/devenv.yaml"
          cp "${GITHUB_WORKSPACE}/devenv.lock" "$check_dir/devenv.lock"
          {
            echo '{ config, ... }:'
            echo '{'
            echo '  imports = ['
            echo "    ${GITHUB_WORKSPACE}/modules/default.nix"
            echo "    ${GITHUB_WORKSPACE}/examples/external-extension/module.nix"
            echo '  ];'
            echo '  workenv = {'
            echo '    base.enable = true;'
            echo '    apoc.enable = true;'
            echo '    tools.enable = true;'
            echo '    rust.enable = false;'
            echo '    rust.rustPackage = config.languages.rust.toolchainPackage;'
            printf '    %s.enable = true;\n' $adapters
            echo '  };'
            echo '  exampleExtension.enable = true;'
            echo '}'
          } > "$check_dir/devenv.nix"
          cat "$check_dir/devenv.nix"

          expected="$( { echo example.independent; printf 'workenv.%s\n' $adapters; } | jq -R . | jq -sc .)"
          echo "expecting: $expected"

          nix run github:cachix/devenv/e0781f7bee573eefcab4a7d2788fd9b455560ca2 -- eval --from "path:$check_dir" workenv.manifestJSON > "$check_dir/manifest.json"
          nix run github:cachix/devenv/e0781f7bee573eefcab4a7d2788fd9b455560ca2 -- shell -- jq -e --argjson expected "$expected" '
            ."workenv.manifestJSON" | fromjson | .extensions | keys as $declared |
            (($expected - $declared) as $missing |
             ($declared - $expected) as $extra |
             if ($missing | length) > 0 then
               "missing extensions: \($missing | join(", "))" | halt_error(1)
             elif ($extra | length) > 0 then
               "undeclared extensions: \($extra | join(", "))" | halt_error(1)
             else true end)
          ' "$check_dir/manifest.json"
