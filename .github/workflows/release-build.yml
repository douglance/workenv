name: Release Build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: workenv-x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: workenv-aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: workenv-x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: workenv-aarch64-apple-darwin
            use-cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Artifact Scope
        run: echo "This workflow proves compiled release artifacts only; it is not physical installation, launch, or runtime proof."
      - name: Install Cross
        if: matrix.use-cross
        run: cargo install cross --locked
      - name: Resolve Shipped Binaries
        run: |
          # Asked of the workspace rather than listed here. The two hand-kept
          # arrays this replaces had both gone stale: they named nine crates and
          # omitted workenv-adapter-lima and workenv-adapter-orchard, so every
          # release tarball carried exedev as its only provider adapter. Found by
          # diffing the arrays against `cargo metadata`, which is the thing that
          # knows. xtask is the one build-only crate and is excluded by name.
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[]; .kind[] == "bin")) | .name' \
            | grep -v '^xtask$' \
            | sort > "${RUNNER_TEMP}/shipped-binaries.txt"
          # An empty or truncated list would package nothing and still exit 0.
          test "$(wc -l < "${RUNNER_TEMP}/shipped-binaries.txt")" -ge 11
          cat "${RUNNER_TEMP}/shipped-binaries.txt"
      - name: Build
        run: |
          # `while read`, not `mapfile`: macOS runners ship bash 3.2.
          packages=()
          while IFS= read -r name; do
            packages+=(-p "$name")
          done < "${RUNNER_TEMP}/shipped-binaries.txt"
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --locked --release --target "${{ matrix.target }}" "${packages[@]}"
          else
            cargo build --locked --release --target "${{ matrix.target }}" "${packages[@]}"
          fi
      - name: Package
        run: |
          artifact_dir="dist/${{ matrix.artifact }}"
          binary_dir="target/${{ matrix.target }}/release"

          mkdir -p "$artifact_dir/bin"
          # The same file the build step read, so packaging cannot ship a
          # different set than was built.
          while IFS= read -r binary; do
            cp "$binary_dir/$binary" "$artifact_dir/bin/$binary"
          done < "${RUNNER_TEMP}/shipped-binaries.txt"

          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          shasum -a 256 "dist/${{ matrix.artifact }}.tar.gz" > "dist/${{ matrix.artifact }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
